[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = Code

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
build_flags =
    -DCORE_DEBUG_LEVEL=0
board_build.arduino.psram = false
upload_speed = 460800
